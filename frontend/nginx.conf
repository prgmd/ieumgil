# 프론트엔드 컨테이너 내부 nginx — 정적 번들만 서빙한다.
# HTTPS 종료와 /api·/ws 프록시는 호스트 nginx 몫이다 (docs/deploy.md 참고).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 요청 IP 는 호스트 nginx 가 X-Forwarded-For 로 넘겨준다 — 액세스 로그에 남긴다
    log_format fwd '$http_x_forwarded_for - "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log fwd;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Vite 산출물은 파일명에 콘텐츠 해시가 붙는다 — 내용이 바뀌면 이름이 바뀌므로
    # 영구 캐시가 안전하다. immutable 은 새로고침에도 재검증하지 않게 한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않는다. 여기가 캐시되면 새 이미지를 배포해도
    # 브라우저가 옛 index 를 물고 있어 사라진 해시 번들을 계속 요청한다(흰 화면).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA — 딥링크·새로고침(/groups/1/projects/1)이 404 가 아니라 index.html 로
    # 떨어져야 React Router 가 받는다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
