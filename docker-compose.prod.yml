# 이음길 — EC2 운영 스택 (frontend + backend + postgres + redis)
#
# 소스 없이 **이미지만 받아 켜는** 파일이다. build: 섹션이 하나도 없다.
# 이미지는 소스가 있는 곳(로컬 PC)에서 굽고 레지스트리에 올린 뒤, 여기서는
# .env 의 태그만 바꿔 pull 한다.
#
# EC2 에 두는 파일은 둘뿐이다:
#   ~/ieumgil/docker-compose.yml   ← 이 파일
#   ~/ieumgil/.env                 ← .env.prod.example 참고
#
# 배포:
#   vi .env                        # *_IMAGE 태그 수정
#   docker compose pull
#   docker compose up -d           # 바뀐 서비스만 재생성된다 (DB 는 안 건드린다)
#
# ⚠️ down 을 쓰지 말 것. 스택 전체가 내려간다(볼륨은 살지만 DB 다운타임).
#    한 서비스만 다시 올리려면:  docker compose up -d frontend
#
# ⚠️ name 을 바꾸지 말 것. 볼륨 이름이 <name>_postgres-data 로 결정되므로,
#    name 이 달라지면 **빈 DB 가 새로 생긴다**(기존 데이터는 옛 볼륨에 남는다).

name: ieumgil

services:
  postgres:
    # 로컬에서 빌드해 둔 커스텀 이미지(TZ + initdb). EC2 에 이미 존재하면 그대로 쓴다.
    # 없다면 소스가 있는 곳에서 backend/docker/postgres 를 빌드해 push 할 것.
    image: ${POSTGRES_IMAGE:-ieumgil/postgres:16-alpine}
    container_name: ieumgil-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 127.0.0.1 고정 — 외부에 DB 를 노출하지 않는다. 절대 0.0.0.0 으로 바꾸지 말 것.
      # 원격에서 봐야 하면 SSH 터널을 쓴다:  ssh -L 5432:127.0.0.1:5432 user@server
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-ieumgil/redis:7-alpine}
    container_name: ieumgil-redis
    restart: unless-stopped
    mem_limit: 256m
    ports:
      # Redis 는 비밀번호가 없으므로 외부 바인딩 금지 (무인증 노출 시 RCE 까지 이어진다)
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    container_name: ieumgil-backend
    restart: unless-stopped
    # 제한이 없으면 JVM(-XX:MaxRAMPercentage=75)이 "호스트 전체"의 75% 를 힙 상한으로 잡는다
    mem_limit: 1g
    pull_policy: always
    ports:
      # 컨테이너 안은 항상 8080. 호스트 포트만 환경별로 바꾼다.
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # HTTPS 뒤에 있으므로 true. nginx 가 X-Forwarded-Proto 를 넘겨야 판정이 맞는다.
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-true}
      # nginx 가 같은 도메인에서 /api 를 프록시하므로 same-origin — None 이 필요 없다
      AUTH_REFRESH_COOKIE_SAME_SITE: ${AUTH_REFRESH_COOKIE_SAME_SITE:-Lax}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      TOUR_API_KEY: ${TOUR_API_KEY}
      GMS_API_KEY: ${GMS_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      ODSAY_API_KEY: ${ODSAY_API_KEY}
      OPINET_API_KEY: ${OPINET_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # ⚠️ VITE_* 는 여기 없다. 런타임 환경변수가 아니라 **이미지를 만들 때 번들에
    #    구워지는 값**이라, 도메인·카카오 Redirect URI 를 바꾸려면 이미지를 다시 굽는다.
    image: ${FRONTEND_IMAGE}
    container_name: ieumgil-frontend
    restart: unless-stopped
    mem_limit: 128m
    pull_policy: always
    ports:
      # 127.0.0.1 고정 — 0.0.0.0 으로 열면 HTTPS 를 우회해 평문으로 들어오는 길이 생긴다
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
